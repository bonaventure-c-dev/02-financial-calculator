<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Compound Interest Calculator | BC.Dev</title>
        <link rel="stylesheet" href="css/styles.css">
        <!-- Google Fonts for crisp typography -->
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="css/styles.css">
    </head>
    <body>

        <main class="calculator-container">
            <header class="calculator-header">
                <h1>Compound Interest Calculator</h1>
                <p>Visualize how your money grows over time with compound interest.</p>
            </header>

            <form id="calculator-form">
                <!-- Initial Deposit -->
                <div class="input-group">
                    <label for="initial">Initial Investment ($)</label>
                    <input type="number" id="initial" placeholder="e.g. 1000" min="0" required>
                </div>

                <!-- Monthly Contribution -->
                <div class="input-group">
                    <label for="monthly">Monthly Contribution ($)</label>
                    <input type="number" id="monthly" placeholder="e.g. 100" min="0" required>
                </div>

                <!-- Interest Rate -->
                <div class="input-group">
                    <label for="rate">Estimated Interest Rate (% per year)</label>
                    <input type="number" id="rate" step="0.1" placeholder="e.g. 7" min="0" required>
                </div>

                <!-- Investment Horizon -->
                <div class="input-group">
                    <label for="years">Investment Horizon (Years)</label>
                    <input type="number" id="years" placeholder="e.g. 10" min="1" max="50" required>
                </div>

                <button type="submit" id="calc-btn">Calculate Growth</button>
            </form>

            <!-- Results Section (Initially hidden) -->
            <section id="results" class="results-card hidden">
                <h2>Estimated Future Balance</h2>
                <div class="total-amount" id="total-balance">$0.00</div>
                
                <div class="breakdown">
                    <div class="breakdown-item">
                        <span>Total Deposits:</span>
                        <strong id="total-contributions">$0.00</strong>
                    </div>
                    <div class="breakdown-item">
                        <span>Total Interest Earned:</span>
                        <strong id="total-interest">$0.00</strong>
                    </div>
                </div>
            </section>
        </main>

        <script src="js/script.js"></script>
    </body>
</html>
